<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Production policy; `bun run dev` widens connect-src for HMR (devServerCsp
      in electron.vite.config.ts). In a file:// page 'self' matches every local
      file, so connect-src, frame-src and worker-src are 'none': the renderer
      reaches main over IPC and fetches nothing. style-src needs
      'unsafe-inline' for CodeMirror's <style> element and bits-ui's style
      attributes; img-src needs data: for CodeMirror's SVG markers.
      frame-ancestors isn't listed because a <meta> policy can't set it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <title>Snowboy</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
